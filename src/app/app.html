@let text = ui();
<button type="button" class="skip-link" (click)="main.focus()">{{ text.app.skipToContent }}</button>

<header class="app-bar">
  <button
    type="button"
    class="icon-button"
    aria-controls="app-nav"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-label]="text.nav.openMenu"
    (click)="menuOpen.set(true)"
  >
    <nc-icon name="menu" />
  </button>
  <a class="app-bar__name" routerLink="/">{{ text.app.name }}</a>
</header>

<nc-side-nav
  id="app-nav"
  class="app-nav"
  [class.app-nav--open]="menuOpen()"
  (closeMenu)="menuOpen.set(false)"
/>
@if (menuOpen()) {
  <button
    type="button"
    class="app-scrim"
    tabindex="-1"
    [attr.aria-label]="text.nav.closeMenu"
    (click)="menuOpen.set(false)"
  ></button>
}

<main #main id="main" class="app-main" tabindex="-1" [attr.inert]="menuOpen() ? '' : null">
  <div class="app-sheet">
    <router-outlet />
  </div>
</main>

@if (panel.isOpen()) {
  <nc-law-panel class="app-panel" />
}
