@let text = ui();
<nc-page-layout main="reading">
  <nc-page-header
    pageHeader
    [heading]="text.nav.glossary"
    [lead]="text.glossary.lead(glossary.terms().length)"
  >
    <input
      class="text-field glossary-filter"
      type="search"
      [attr.aria-label]="text.glossary.filterLabel"
      [placeholder]="text.glossary.filterPlaceholder"
      [formField]="filter"
    />
    <nav class="glossary-letters" [attr.aria-label]="text.glossary.letters">
      @for (group of groups(); track group.letter) {
        <a [routerLink]="[]" [fragment]="'letter-' + group.letter">{{ group.letter }}</a>
      }
    </nav>
  </nc-page-header>

  <nc-load-status [resource]="glossary.resource" />

  @for (group of groups(); track group.letter) {
    <section class="glossary-group" [id]="'letter-' + group.letter">
      <h2 class="glossary-group__letter" lang="bg">{{ group.letter }}</h2>
      <nc-glossary-list [terms]="group.terms" />
    </section>
  } @empty {
    @if (glossary.resource.hasValue()) {
      <p class="glossary-empty">{{ text.glossary.noMatch }}</p>
    }
  }
</nc-page-layout>
