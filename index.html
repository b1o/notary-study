<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Нотариална кантора — курс</title>
  <meta name="description" content="A complete bilingual course on notarial work in Bulgaria: chapters, law library, flashcards, tests, templates and tools.">
  <link rel="icon" href="assets/img/seal.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans:ital,wght@0,300..800;1,400..600&family=Sofia+Sans+Extra+Condensed:wght@500..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&display=swap">
  <link rel="stylesheet" href="assets/css/app.css">
  <script>
    /* Apply the saved theme before the first paint. */
    try {
      var s = JSON.parse(localStorage.getItem('nc.v1') || '{}');
      if (s.theme === 'dark' || s.theme === 'light') document.documentElement.setAttribute('data-theme', s.theme);
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <a class="brand" href="#/">
        <img src="assets/img/seal.svg" alt="" width="30" height="30">
        <span class="brand-text" data-i18n="brand"></span>
      </a>
      <form class="search" id="searchForm" role="search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="search" id="searchInput" autocomplete="off" data-i18n-placeholder="searchPlaceholder" aria-label="Search">
      </form>
      <div class="top-actions">
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="bg">БГ</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button class="icon-btn" id="themeBtn" type="button" data-i18n-title="theme">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <nav class="sidebar" id="sidebar" aria-label="Course navigation"></nav>
    <div class="scrim" id="scrim" hidden></div>

    <main id="main" class="main" tabindex="-1"></main>

    <aside class="margin" id="margin" aria-live="polite" hidden></aside>
  </div>

  <script src="assets/js/core.js"></script>
  <script src="assets/js/markdown.js"></script>
  <script src="assets/js/laws.js"></script>
  <script src="assets/js/views.js"></script>
  <script src="assets/js/study.js"></script>
  <script src="assets/js/tools.js"></script>
  <script src="content/manifest.js"></script>
  <script src="laws/catalog.js"></script>
  <script src="laws/en/index.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
